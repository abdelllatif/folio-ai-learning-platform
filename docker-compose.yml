# Full stack: PostgreSQL, Ollama (Qwen2.5), Django API, React app behind nginx.
#   docker compose up --build        → http://localhost:8080
# First start downloads the Qwen2.5 model (~4.7 GB) once.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: folio
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folio"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    # Uncomment on a machine with an NVIDIA GPU:
    # deploy: { resources: { reservations: { devices: [{ capabilities: [gpu] }] } } }

  ollama-pull:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment: { OLLAMA_HOST: "http://ollama:11434" }
    entrypoint: ["/bin/sh", "-c", "sleep 5 && ollama pull ${OLLAMA_MODEL:-qwen2.5:7b}"]
    restart: "no"

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      POSTGRES_HOST: db
      POSTGRES_DB: folio
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      SEED_DEMO: ${SEED_DEMO:-1}
      SECURE_COOKIES: "0"
    volumes:
      - media:/app/media
      - hf-cache:/root/.cache/huggingface

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  pgdata:
  ollama:
  media:
  hf-cache:
